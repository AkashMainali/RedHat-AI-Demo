---
- name: Ansible Automation Platform (containerized) install
  when: aap_install_enabled | bool
  block:
    # --- validate before changing anything --------------------------------
    - name: Validate the inputs AAP requires
      ansible.builtin.assert:
        that:
          - rh_registry_username | length > 0
          - rh_registry_password | length > 0
          - vault_password | length > 0
          - aap_admin_password | length > 0
        fail_msg: >-
          AAP install requires registry credentials (rh_registry_username/password),
          vault_password, and aap_admin_password. Set aap_install_enabled=false
          in group_vars/all.yml to provision everything except AAP.
        quiet: true

    # --- prerequisites, BEFORE anything that uses them --------------------
    # ansible-core has to come first: it provides ansible-vault, which the vault
    # tasks below shell out to, and ansible-playbook, which runs the installer.
    # Installing it later (as this role used to) fails with
    # "ansible-vault: command not found".
    - name: Install ansible-core and the utilities the installer needs
      ansible.builtin.dnf:
        name:
          - ansible-core
          - tar
          - gzip
          - bzip2
          - xz
          - zstd
          - unzip
        state: present

    - name: Locate ansible-vault
      ansible.builtin.command:
        cmd: which ansible-vault
      register: ansible_vault_bin
      changed_when: false
      failed_when: false

    - name: Fail clearly if ansible-vault is still unavailable
      ansible.builtin.fail:
        msg: >-
          ansible-core installed but 'ansible-vault' is not on PATH. Check that
          the ansible-core package resolved from an enabled repository on this
          RHEL {{ ansible_distribution_major_version | default('?') }} host
          (dnf repolist), then re-run.
      when: ansible_vault_bin.rc != 0

    # --- hostname resolution ----------------------------------------------
    - name: Gather system facts to get hostname
      ansible.builtin.setup:
        gather_subset: all

    - name: Set hostname variable for inventory
      ansible.builtin.set_fact:
        system_hostname: "{{ ansible_hostname }}"

    - name: Ensure system hostname resolves to the control node's private IP in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ control_private_ip }} {{ system_hostname }} {{ system_hostname }}.local"
        regexp: "^.*{{ system_hostname }}"
        state: present
      become: true

    # --- registry credentials, encrypted at rest on the control node -------
    - name: Create the encrypted vault file on the control node
      block:
        - name: Create the vault password file
          ansible.builtin.copy:
            content: "{{ vault_password }}"
            dest: "/home/{{ lab_user }}/.vault_pass"
            mode: "0600"
            owner: "{{ lab_user }}"
            group: "{{ lab_user }}"
          no_log: true

        - name: Write the registry credentials in plaintext (encrypted next)
          ansible.builtin.copy:
            content: |
              registry_username: {{ rh_registry_username | quote }}
              registry_password: {{ rh_registry_password | quote }}
            dest: "/home/{{ lab_user }}/.vault.yml"
            mode: "0600"
            owner: "{{ lab_user }}"
            group: "{{ lab_user }}"
          no_log: true

        - name: Encrypt the vault file
          # Uses the resolved absolute path rather than relying on the PATH of a
          # non-login become_user shell.
          ansible.builtin.shell: |
            set -o pipefail
            {{ ansible_vault_bin.stdout | trim }} encrypt \
              --vault-password-file /home/{{ lab_user }}/.vault_pass \
              /home/{{ lab_user }}/.vault.yml \
            && mv -f /home/{{ lab_user }}/.vault.yml /home/{{ lab_user }}/.vault
          args:
            executable: /bin/bash
          become: true
          become_user: "{{ lab_user }}"
          changed_when: true

        - name: Verify the encrypted vault file exists
          ansible.builtin.stat:
            path: "/home/{{ lab_user }}/.vault"
          register: vault_file_stat

        - name: Fail if the vault file was not created
          ansible.builtin.fail:
            msg: >-
              Failed to create the encrypted vault file at
              /home/{{ lab_user }}/.vault on the control node.
          when: not vault_file_stat.stat.exists

        - name: Remove any plaintext leftover
          # Belt-and-braces: if the mv above ever failed after encryption, the
          # plaintext credentials must not be left behind.
          ansible.builtin.file:
            path: "/home/{{ lab_user }}/.vault.yml"
            state: absent

    - name: Create AAP installer directory
      ansible.builtin.file:
        path: "/tmp/aap-installer"
        state: directory
        mode: "0755"

    - name: Find local AAP tarball in ansible/aap/ directory
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/aap"
        patterns: "*.tar.gz"
      register: local_aap_tarball
      delegate_to: localhost
      become: false

    - name: Verify AAP tarball exists locally
      ansible.builtin.assert:
        that:
          - local_aap_tarball.files | length > 0
        fail_msg: >
          No AAP tarball found in ansible/aap/.
          Download the AAP 2.6 CONTAINERIZED setup bundle
          (ansible-automation-platform-containerized-setup-2.6-*.tar.gz) into
          ansible/aap/ from
          https://developers.redhat.com/products/ansible/download

    - name: Copy AAP tarball from local ansible/aap/ to remote /tmp/aap-installer/
      ansible.builtin.copy:
        src: "{{ local_aap_tarball.files[0].path }}"
        dest: "/tmp/aap-installer/aap.tar.gz"
        mode: "0644"

    - name: Extract AAP tarball
      ansible.builtin.shell: |
        cd /tmp/aap-installer && tar -xzf aap.tar.gz
      register: extract_aap
      changed_when: extract_aap.rc == 0

    - name: Find the AAP installer directory
      ansible.builtin.shell: |
        ls -d /tmp/aap-installer/ansible-automation-platform-*/ 2>/dev/null | head -1
      register: aap_dir
      changed_when: false

    - name: Set AAP installer path
      ansible.builtin.set_fact:
        aap_installer_dir: "{{ aap_dir.stdout | regex_replace('/$', '') }}"

    - name: Template the containerized installer inventory (mode 0600, no_log)
      ansible.builtin.template:
        src: aap-inventory.j2
        dest: "{{ aap_inventory_path }}"
        owner: "{{ lab_user }}"
        group: "{{ lab_user }}"
        mode: "0600"
      become: true
      no_log: true

    - name: Open the AAP gateway port (443) in firewalld
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    - name: Enable lingering for lab-user (required for user-scope systemd services)
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ lab_user }}"
      changed_when: false
      become: true

    - name: Verify AAP inventory file exists
      ansible.builtin.stat:
        path: "{{ aap_inventory_path }}"
      register: inventory_stat
      become: true

    - name: Fail if inventory file does not exist
      ansible.builtin.fail:
        msg: "AAP inventory file not found at {{ aap_inventory_path }}"
      when: not inventory_stat.stat.exists

    - name: Debug - Check AAP installer directory structure
      ansible.builtin.shell: |
        ls -la "{{ aap_installer_dir }}" | head -20
        echo "---"
        ls -la "{{ aap_installer_dir }}/collections/ansible_collections/" 2>/dev/null | grep containerized || echo "containerized_installer not found"
      register: aap_dir_check
      changed_when: false

    - name: Debug - Show AAP directory check
      ansible.builtin.debug:
        var: aap_dir_check.stdout

    - name: Run the AAP containerized installer from tarball (runs rootless as the lab user; takes a while)
      ansible.builtin.shell: |
        set -x
        cd "{{ aap_installer_dir }}" && \
        export ANSIBLE_COLLECTIONS_PATH="{{ aap_installer_dir }}/collections:~/.ansible/collections:/usr/share/ansible/collections" && \
        export ANSIBLE_LIBRARY="{{ aap_installer_dir }}/library" && \
        /usr/bin/ansible-playbook \
          -i {{ aap_inventory_path }} \
          --vault-password-file /home/{{ lab_user }}/.vault_pass \
          -e "@/home/{{ lab_user }}/.vault" \
          -e "ansible_user={{ lab_user }}" \
          -e "ansible_connection=local" \
          -vvv \
          ansible.containerized_installer.install 2>&1 | tee /tmp/aap_install.log
      become: true
      become_user: "{{ lab_user }}"
      register: aap_install
      changed_when: aap_install.rc == 0
      timeout: 3600
      no_log: false

    - name: Debug - Show AAP install output
      ansible.builtin.debug:
        msg: "{{ aap_install.stdout_lines[-50:] if aap_install.stdout_lines else 'No output' }}"

    # Attach the subscription while the Red Hat credentials are still to hand.
    # Without it the demo_content stage fails on POST /hosts/ with a 403 that
    # reads like a permissions problem.
    #
    # Separately tagged so it can be run on its own against an already-installed
    # AAP, without the 20-40 minute install:
    #   ./scripts/bootstrap.sh --tags subscription
    # These tasks depend only on group_vars and the inventory, never on the
    # earlier tasks in this role, so running them in isolation is safe.
    - name: Attach the AAP subscription
      ansible.builtin.include_tasks:
        file: subscription.yml
        apply:
          tags: [aap, subscription]
      tags: [aap, subscription]
  rescue:
    # Report WHICH task failed and what it said, before offering guidance. The
    # previous version printed generic AAP-install advice for every failure in
    # the block, which sent you looking at registry credentials when the real
    # cause was a missing package.
    - name: Show the task that actually failed
      ansible.builtin.debug:
        msg:
          - "Failed task : {{ ansible_failed_task.name | default('unknown') }}"
          - "Return code : {{ ansible_failed_result.rc | default('n/a') }}"
          - "stderr      : {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) | default('none') | truncate(600, true) }}"

    - name: Surface actionable AAP install guidance
      ansible.builtin.fail:
        msg: >-
          {% if 'subscription' in (ansible_failed_task.name | default('') | lower) %}
          AAP installed successfully, but the SUBSCRIPTION step failed. The
          message above has the detail and the fix - in short:
            ./scripts/attach-subscription.sh --pool "Partner"
            ./scripts/bootstrap.sh --tags subscription,demo_content
          The platform is up; only the subscription and the demo objects are
          outstanding, and neither needs the installer to run again.
          {% else %}
          The AAP 2.6 containerized install failed at
          "{{ ansible_failed_task.name | default('an unknown task') }}".
          {% if 'command not found' in (ansible_failed_result.stderr | default('')) %}
          A required command was missing - this points at a package that did not
          install. Check 'dnf repolist' on the control node: the ansible-core and
          AAP repositories must both be enabled for the attached subscription.
          {% elif 'inventory' in (ansible_failed_task.name | default('') | lower) %}
          The installer inventory could not be rendered or found. Check
          {{ aap_inventory_path }} on the control node.
          {% elif 'installer' in (ansible_failed_task.name | default('') | lower) %}
          The installer itself failed. Read /tmp/aap_install.log on the control
          node - the last 50 lines were printed above. Usual causes: registry
          credentials rejected by registry.redhat.io, an AAP 2.6 inventory
          variable mismatch, or insufficient memory on the control node.
          {% else %}
          See the failed task and stderr above.
          {% endif %}
          This stage is safely re-runnable: fix the cause and re-run, or set
          aap_install_enabled=false in ansible/group_vars/all.yml to build
          everything except AAP.
          {% endif %}
