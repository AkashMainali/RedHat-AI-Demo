---
# =============================================================================
# Remediation step 2 - commit the AI-generated playbook to Git.
#
# Git is the source of truth and the audit trail: every AI-authored fix is a
# reviewable commit before it is ever executed. In production this is where you
# would open a pull request into a protected branch instead of pushing to main.
#
# Uses the Gitea contents API via ansible.builtin.uri rather than the ansible.scm
# collection, so it runs on the default execution environment with no extra
# collection and no git binary or SSH key inside the EE.
#
# Adapted from ansible-tmm/aiops-summitlab (scm_pr.yml).
# =============================================================================
- name: Commit the generated playbook to Gitea
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _gitea: "{{ gitea_url | default('') | regex_replace('/$', '') }}"
    _owner: "{{ gitea_owner | default('lab-user') }}"
    _repo: "{{ gitea_playbook_repo | default('lightspeed-playbooks') }}"
    _path: "{{ gitea_playbook_file | default('lightspeed-response.yml') }}"

  tasks:
    - name: Validate the Gitea credential is attached
      ansible.builtin.assert:
        that:
          - _gitea | length > 0
          - gitea_token | default('') | length > 0
          - generated_playbook | default('') | length > 0
        fail_msg: >-
          Requires the "Demo Gitea" credential (gitea_url, gitea_token) and a
          generated_playbook artifact from the generator job.
        quiet: true

    # ---------------------------------------------------------------------
    # Safety guard: the AI does not know our inventory. Force the play to
    # target 'all' so the operator controls scope with --limit at launch,
    # and force become so the config edit and service restart can succeed.
    # ---------------------------------------------------------------------
    - name: Parse the generated playbook
      ansible.builtin.set_fact:
        _plays: "{{ generated_playbook | from_yaml }}"

    - name: Normalise hosts and become across every play
      ansible.builtin.set_fact:
        _safe_plays: >-
          {{ _plays
             | map('combine', {'hosts': 'all', 'become': true})
             | list }}

    - name: Render the sanitised playbook
      ansible.builtin.set_fact:
        _final_playbook: |
          ---
          # Generated by {{ generated_by | default('AI') }} via Ansible Automation Platform.
          # Reviewed prompt: {{ lightspeed_prompt | default('n/a') }}
          {{ _safe_plays | to_nice_yaml(indent=2, sort_keys=False) }}

    - name: Show what will be committed
      ansible.builtin.debug:
        msg: "{{ _final_playbook.split('\n') }}"

    - name: Look up the existing file so we can update it in place
      ansible.builtin.uri:
        url: "{{ _gitea }}/api/v1/repos/{{ _owner }}/{{ _repo }}/contents/{{ _path }}"
        method: GET
        headers:
          Authorization: "token {{ gitea_token }}"
        status_code: [200, 404]
        validate_certs: false
      register: existing
      no_log: true

    - name: Create the playbook file
      ansible.builtin.uri:
        url: "{{ _gitea }}/api/v1/repos/{{ _owner }}/{{ _repo }}/contents/{{ _path }}"
        method: POST
        headers:
          Authorization: "token {{ gitea_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          message: "AI-generated remediation for {{ incident_service | default('httpd') }}"
          content: "{{ _final_playbook | b64encode }}"
          branch: "{{ gitea_branch | default('main') }}"
        status_code: [201]
        validate_certs: false
      when: existing.status == 404
      no_log: true

    - name: Update the playbook file
      ansible.builtin.uri:
        url: "{{ _gitea }}/api/v1/repos/{{ _owner }}/{{ _repo }}/contents/{{ _path }}"
        method: PUT
        headers:
          Authorization: "token {{ gitea_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          message: "AI-generated remediation for {{ incident_service | default('httpd') }}"
          content: "{{ _final_playbook | b64encode }}"
          sha: "{{ existing.json.sha }}"
          branch: "{{ gitea_branch | default('main') }}"
        status_code: [200]
        validate_certs: false
      when: existing.status == 200
      no_log: true

    - name: Report where to review the commit
      ansible.builtin.debug:
        msg: >-
          Committed {{ _path }} to {{ _gitea }}/{{ _owner }}/{{ _repo }} -
          review it before the remediation job runs.
