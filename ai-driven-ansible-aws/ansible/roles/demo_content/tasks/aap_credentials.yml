---
# =============================================================================
# AAP credentials as code.
#
# Three custom credential types carry the demo's integration settings. Using
# credentials rather than job-template extra vars means the values are stored
# encrypted in AAP, are hidden in the UI and job output, and can be rotated
# without touching any playbook.
#
# SCHEMA MIGRATION: AAP refuses to modify the inputs/injectors of a credential
# type that already has credentials attached, and reports it as
#   "You don't have permission to PATCH to .../credential_types/<id>/ (HTTP 403)"
# which reads like an auth failure but is not. So whenever a type's field list
# has changed since the last run, the credentials using it are deleted first -
# they are recreated further down in this same file, and the job templates that
# reference them are rebuilt in the next task file, so nothing is left dangling.
# =============================================================================

# --- field definitions, declared once and reused -----------------------------
# Used both to define the credential types below AND to detect schema drift, so
# the two can never disagree.
- name: Define the credential type schemas
  ansible.builtin.set_fact:
    _ai_ct_fields:
      - {id: ai_model_url, type: string, label: "Endpoint base URL (must end in /v1)"}
      - {id: ai_model_id, type: string, label: "Model identifier"}
      - {id: ai_codegen_model_id, type: string, label: "Model identifier for code generation (optional)"}
      - {id: ai_model_api_key, type: string, label: "API key / bearer token", secret: true}
    _gitea_ct_fields:
      - {id: gitea_url, type: string, label: "Gitea base URL"}
      - {id: gitea_owner, type: string, label: "Repository owner"}
      - {id: gitea_token, type: string, label: "API token", secret: true}
    _mm_ct_fields:
      - {id: mattermost_webhook_url, type: string, label: "Incoming webhook URL", secret: true}

# --- detect and clear schema drift ------------------------------------------
- name: Look up the existing custom credential types
  ansible.builtin.uri:
    url: "{{ aap_controller_host }}/api/controller/v2/credential_types/?name={{ item.name | urlencode }}"
    method: GET
    url_username: "{{ aap_admin_user }}"
    url_password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  loop:
    - {name: "{{ ai_credential_name }}", fields: "{{ _ai_ct_fields }}"}
    - {name: "{{ gitea_credential_name }}", fields: "{{ _gitea_ct_fields }}"}
    - {name: "{{ mattermost_credential_name }}", fields: "{{ _mm_ct_fields }}"}
  loop_control:
    label: "{{ item.name }}"
  register: _existing_cts
  failed_when: false
  no_log: true

- name: Compare declared fields with what AAP currently holds
  ansible.builtin.set_fact:
    _stale_types: >-
      {{ _stale_types | default([]) + (
           [item.item.name]
           if ((item.json.results[0].inputs.fields | map(attribute='id') | sort)
               != (item.item.fields | map(attribute='id') | sort))
           else []
         ) }}
  loop: "{{ _existing_cts.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.json is defined
    - (item.json.count | default(0) | int) > 0
  no_log: true

- name: Report any credential type whose schema must be migrated
  ansible.builtin.debug:
    msg: >-
      Credential type schema changed since the last run:
      {{ _stale_types | default([]) }}.
      AAP will not modify a type that has credentials attached, so those
      credentials are being deleted and immediately recreated below.
  when: (_stale_types | default([])) | length > 0

- name: Delete credentials blocking a credential type update
  ansible.controller.credential:
    name: "{{ item }}"
    organization: "{{ demo_organization }}"
    credential_type: "{{ item }}"
    state: absent
  loop: "{{ _stale_types | default([]) }}"
  loop_control:
    label: "{{ item }}"
  failed_when: false
  no_log: true

# --- custom credential types ------------------------------------------------
- name: Define the AI endpoint credential type
  ansible.controller.credential_type:
    name: "{{ ai_credential_name }}"
    kind: cloud
    description: "OpenAI-compatible inference endpoint used by the demo"
    inputs:
      fields: "{{ _ai_ct_fields }}"
      required:
        - ai_model_url
        - ai_model_id
    injectors:
      extra_vars:
        ai_model_url: "{% raw %}{{ ai_model_url }}{% endraw %}"
        ai_model_id: "{% raw %}{{ ai_model_id }}{% endraw %}"
        ai_codegen_model_id: "{% raw %}{{ ai_codegen_model_id }}{% endraw %}"
        ai_model_api_key: "{% raw %}{{ ai_model_api_key }}{% endraw %}"
    state: present
  no_log: true

- name: Define the Gitea API credential type
  ansible.controller.credential_type:
    name: "{{ gitea_credential_name }}"
    kind: cloud
    description: "Gitea API access for committing AI-generated playbooks"
    inputs:
      fields: "{{ _gitea_ct_fields }}"
      required:
        - gitea_url
        - gitea_token
    injectors:
      extra_vars:
        gitea_url: "{% raw %}{{ gitea_url }}{% endraw %}"
        gitea_owner: "{% raw %}{{ gitea_owner }}{% endraw %}"
        gitea_token: "{% raw %}{{ gitea_token }}{% endraw %}"
    state: present
  no_log: true

- name: Define the Mattermost webhook credential type
  ansible.controller.credential_type:
    name: "{{ mattermost_credential_name }}"
    kind: cloud
    description: "Mattermost incoming webhook for incident notifications"
    inputs:
      fields: "{{ _mm_ct_fields }}"
      required:
        - mattermost_webhook_url
    injectors:
      extra_vars:
        mattermost_webhook_url: "{% raw %}{{ mattermost_webhook_url }}{% endraw %}"
    state: present
  no_log: true

# --- credentials ------------------------------------------------------------
- name: Create the machine credential for the target host
  # The private key is read from the operator's workstation at run time and
  # pushed straight into AAP's encrypted credential store. It is never written
  # to the repo, the inventory, or Terraform state.
  ansible.controller.credential:
    name: "{{ demo_machine_credential }}"
    organization: "{{ demo_organization }}"
    credential_type: "Machine"
    description: "SSH access to the demo target node"
    inputs:
      username: "{{ demo_ssh_user }}"
      ssh_key_data: "{{ lookup('ansible.builtin.file', demo_ssh_private_key_path) }}"
      become_method: sudo
    state: present
  no_log: true

- name: Create the AI endpoint credential
  ansible.controller.credential:
    name: "{{ ai_credential_name }}"
    organization: "{{ demo_organization }}"
    credential_type: "{{ ai_credential_name }}"
    inputs:
      ai_model_url: "{{ ai_model_url }}"
      ai_model_id: "{{ ai_model_id }}"
      ai_codegen_model_id: "{{ ai_codegen_model_id | default('', true) }}"
      ai_model_api_key: "{{ ai_model_api_key | default('not-required') }}"
    state: present
  no_log: true

- name: Create the Gitea API credential
  ansible.controller.credential:
    name: "{{ gitea_credential_name }}"
    organization: "{{ demo_organization }}"
    credential_type: "{{ gitea_credential_name }}"
    inputs:
      gitea_url: "{{ gitea_url_internal }}"
      gitea_owner: "{{ gitea_admin_user }}"
      gitea_token: "{{ gitea_api_token }}"
    state: present
  no_log: true

- name: Create the Mattermost webhook credential
  ansible.controller.credential:
    name: "{{ mattermost_credential_name }}"
    organization: "{{ demo_organization }}"
    credential_type: "{{ mattermost_credential_name }}"
    inputs:
      mattermost_webhook_url: "{{ mattermost_webhook_url }}"
    state: present
  no_log: true

- name: Create the source control credential for Gitea
  ansible.controller.credential:
    name: "{{ scm_credential_name }}"
    organization: "{{ demo_organization }}"
    credential_type: "Source Control"
    description: "Reads the demo content and generated-playbook repos"
    inputs:
      username: "{{ gitea_admin_user }}"
      password: "{{ gitea_api_token }}"
    state: present
  no_log: true

- name: Create the AAP credential so job templates can create job templates
  # This is what lets "Build Ansible Lightspeed Job Template" and
  # "Build HTTPD Remediation Template" call back into the controller API.
  #
  # PRIVATE address: these job templates run inside AAP execution environments on
  # the control node. The public EIP is not routable from inside the VPC.
  ansible.controller.credential:
    name: "{{ aap_credential_name }}"
    organization: "{{ demo_organization }}"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ aap_controller_host_internal }}"
      username: "{{ aap_admin_user }}"
      password: "{{ aap_admin_password }}"
      verify_ssl: false
    state: present
  no_log: true
