---
# =============================================================================
# demo_content - everything the demo needs, as code.
#
#   1. Gitea      repositories, an API token, and the demo playbooks/rulebook
#   2. Mattermost team, channel and incoming webhook
#   3. AAP        credential types, credentials, inventory, projects, job
#                 templates and both workflows
#   4. EDA        project, credentials and the Kafka rulebook activation
#
# Gitea and Mattermost are configured over loopback on the control node so their
# tokens never cross the network. The AAP and EDA API calls are delegated to the
# operator's workstation, which is the only place the ansible.controller
# collection and the target's SSH private key exist.
#
# Idempotent throughout: re-running bootstrap.sh converges rather than
# duplicating. Content is adapted from the public Red Hat Demo Platform lab
# ansible-tmm/aiops-summitlab.
# =============================================================================
- name: Demo content and platform configuration
  when: demo_content_enabled | bool
  block:
    - name: Populate Gitea with the demo content
      ansible.builtin.include_tasks: gitea.yml

    - name: Bootstrap Mattermost
      ansible.builtin.include_tasks: mattermost.yml

    # Checked from the CONTROL NODE, because that is where the AAP execution
    # environments will call the endpoint from. Done before any AAP object is
    # created: the AI credential records these model ids, and a credential that
    # advertises a model the endpoint does not serve fails mid-demo with
    # "model 'x' not found" - long after this stage reported success.
    - name: Ask the AI endpoint which models it serves
      ansible.builtin.uri:
        url: "{{ ai_model_url | regex_replace('/$', '') }}/models"
        method: GET
        headers:
          Authorization: "Bearer {{ ai_model_api_key | default('not-required') }}"
        validate_certs: false
        status_code: [200]
        timeout: 30
      register: _ai_served
      retries: 6
      delay: 10
      until: _ai_served.status | default(0) == 200
      failed_when: false

    - name: Work out which configured models are missing
      ansible.builtin.set_fact:
        _ai_served_ids: "{{ _ai_served.json.data | default([]) | map(attribute='id') | list }}"
        _ai_wanted_ids: >-
          {{ [ai_model_id, ai_codegen_model_id | default('', true)]
             | select | unique | list }}

    - name: Report the endpoint's model inventory
      ansible.builtin.debug:
        msg: >-
          AI endpoint {{ ai_model_url }} serves {{ _ai_served_ids }};
          the demo needs {{ _ai_wanted_ids }}.

    - name: Fail if the endpoint does not serve a model the demo will request
      ansible.builtin.fail:
        msg: >-
          {% set missing = _ai_wanted_ids | reject('in', _ai_served_ids) | list %}
          The AI endpoint does not serve: {{ missing }}.
          It serves: {{ _ai_served_ids | default('nothing - endpoint unreachable') }}.
          {% if ai_backend | default('ollama') == 'ollama' %}
          Pull the missing model(s) on the control node:
          {% for m in missing %}
            sudo podman exec ollama ollama pull {{ m }}
          {% endfor %}
          Or re-run with the AI tag, which pulls them for you:
            ./scripts/bootstrap.sh --tags ai
          {% else %}
          This is an external endpoint, so the model must be deployed there.
          Check the exact id it reports and update the configuration:
            curl -sSk {{ ai_model_url }}/models -H "Authorization: Bearer <token>"
          then re-point the demo with ./scripts/set-ai-endpoint.sh
          {% endif %}
      when: >-
        _ai_served.status | default(0) != 200
        or (_ai_wanted_ids | reject('in', _ai_served_ids) | list | length > 0)

    - name: Wait for the AAP gateway API
      ansible.builtin.uri:
        url: "https://{{ control_public_ip }}/api/gateway/v1/ping/"
        method: GET
        validate_certs: false
        status_code: [200]
      register: _aap_api
      retries: "{{ aap_api_wait_retries }}"
      delay: "{{ aap_api_wait_delay }}"
      until: _aap_api is succeeded
      delegate_to: localhost
      become: false

    # Checked BEFORE creating anything. Without an attached subscription the
    # controller happily accepts inventories and groups, then rejects
    # POST /hosts/ with a 403 - hosts are what consume entitlements. Failing here
    # avoids a half-built configuration and a misleading permissions error.
    - name: Check the AAP subscription before creating anything
      ansible.builtin.uri:
        url: "https://{{ control_public_ip }}/api/controller/v2/config/"
        method: GET
        url_username: "{{ aap_admin_user }}"
        url_password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: _aap_license
      failed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Fail early and actionably if AAP has no usable subscription
      ansible.builtin.fail:
        msg: >-
          {% set li = _aap_license.json.license_info | default({}) %}
          {% set lt = li.license_type | default('unlicensed') %}
          AAP has no usable subscription (license_type: {{ lt }},
          free managed-node slots: {{ li.free_instances | default(0) }}).

          The controller will accept inventories and groups but reject
          POST /hosts/ with HTTP 403, because hosts consume entitlements - so
          this stage would fail part-way through.

          Attach one, then re-run scripts/demo_content.sh:
            1. Open https://{{ control_public_ip }} and log in as
               {{ aap_admin_user }}
            2. Choose "Username/password" at the subscription prompt
            3. Enter your Red Hat login - it fetches your pools directly, no
               manifest export needed

          No AAP entitlement on your account? The free Red Hat Developer
          Subscription for Individuals includes one:
          https://developers.redhat.com/products/ansible/overview
      when: >-
        _aap_license.status | default(0) != 200
        or (_aap_license.json.license_info.license_type | default('unlicensed'))
           in ['unlicensed', 'UNLICENSED', '']
        or (_aap_license.json.license_info.free_instances | default(0) | int) < 1

    - name: Report the subscription in use
      ansible.builtin.debug:
        msg: >-
          AAP subscription OK:
          {{ _aap_license.json.license_info.license_type | default('?') }},
          {{ _aap_license.json.license_info.free_instances | default('?') }}
          managed-node slots free.

    - name: Confirm the ansible.controller collection is available
      ansible.builtin.assert:
        that:
          - >-
            'ansible.controller' in
            lookup('ansible.builtin.pipe', 'ansible-galaxy collection list 2>/dev/null || true')
        fail_msg: >-
          The ansible.controller collection is not on the Ansible collection
          path. scripts/bootstrap.sh extracts it from the AAP setup bundle in
          ansible/aap/ and exports ANSIBLE_COLLECTIONS_PATH - run the demo
          through bootstrap.sh, or install the collection manually.
        quiet: true
      delegate_to: localhost
      become: false
      run_once: true

    # -- everything below talks to the AAP APIs from the workstation ---------
    - name: Configure AAP
      delegate_to: localhost
      become: false
      # The ansible.controller modules read their connection settings from these
      # environment variables. Using them rather than module_defaults avoids
      # depending on the collection's action-group name, and keeps the password
      # out of every task's arguments.
      environment:
        CONTROLLER_HOST: "{{ aap_controller_host }}"
        CONTROLLER_USERNAME: "{{ aap_admin_user }}"
        CONTROLLER_PASSWORD: "{{ aap_admin_password }}"
        CONTROLLER_VERIFY_SSL: "false"
      block:
        - name: Create credential types and credentials
          ansible.builtin.include_tasks: aap_credentials.yml

        - name: Create the inventory and projects
          ansible.builtin.include_tasks: aap_inventory_projects.yml

        - name: Create the job templates
          ansible.builtin.include_tasks: aap_job_templates.yml

        - name: Create the workflows
          ansible.builtin.include_tasks: aap_workflows.yml

    - name: Configure Event-Driven Ansible
      ansible.builtin.include_tasks: eda.yml

    - name: Summarise the demo environment
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.template', 'summary.txt.j2').split('\n') }}"

  rescue:
    - name: Show the task that actually failed
      ansible.builtin.debug:
        msg:
          - "Failed task : {{ ansible_failed_task.name | default('unknown') }}"
          - "Message     : {{ ansible_failed_result.msg | default('none') | truncate(500, true) }}"

    - name: Explain what failed and how to retry
      ansible.builtin.fail:
        msg: >-
          Demo content configuration failed at
          "{{ ansible_failed_task.name | default('an unknown task') }}".
          {% set m = ansible_failed_result.msg | default('') %}
          {% if '403' in m and '/hosts/' in m %}
          The controller refused to create the inventory host. That is a
          SUBSCRIPTION limit, not a permissions problem: hosts consume
          entitlements, which is why the inventory and group above succeeded.
          Attach a subscription at https://{{ control_public_ip }}
          (choose Username/password, enter your Red Hat login) and re-run
          scripts/demo_content.sh.
          {% elif '403' in m and 'credential_types' in m %}
          AAP refused to modify a credential TYPE. This is not an auth problem:
          AAP will not change the inputs/injectors of a credential type that has
          credentials attached. This role migrates that automatically by deleting
          and recreating the affected credentials, so seeing it means the
          migration step did not run - re-run ./scripts/demo_content.sh. If it
          persists, delete the "Demo AI Endpoint" credential in
          Automation Execution > Credentials and re-run.
          {% elif '401' in m %}
          Authentication to the AAP API failed. Check that AAP_ADMIN_PASSWORD
          matches the admin password AAP was installed with.
          {% elif 'ansible.controller' in m %}
          The ansible.controller collection is not on ANSIBLE_COLLECTIONS_PATH.
          Run through scripts/demo_content.sh, which extracts it from the AAP
          bundle in ansible/aap/.
          {% else %}
          See the failed task and message above.
          {% endif %}
          The infrastructure and platform are unaffected and this stage is
          safely re-runnable: ./scripts/demo_content.sh. To skip it entirely, set
          demo_content_enabled=false in ansible/group_vars/all.yml.
