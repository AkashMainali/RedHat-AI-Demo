---
# =============================================================================
# Ollama - the AI inference endpoint for the demo.
#
# Provides an OpenAI-compatible /v1 API on the control node so the demo's
# "Red Hat AI" job templates have something to talk to without a GPU node.
# Swap ai_model_url in group_vars/all.yml to point at RHEL AI, OpenShift AI
# Model Serving, or Red Hat MaaS instead - no playbook changes required.
# =============================================================================
- name: Deploy the Ollama quadlet unit
  ansible.builtin.template:
    src: ollama.container.j2
    dest: /etc/containers/systemd/ollama.container
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart ollama

- name: Reload systemd so the generated Ollama service exists
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start Ollama
  ansible.builtin.systemd:
    name: ollama.service
    state: started

- name: Open the Ollama port in firewalld
  # Rootless AAP execution environments reach this over the host's private IP,
  # so the host firewall applies even though the traffic never leaves the node.
  ansible.posix.firewalld:
    port: "{{ ollama_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Wait for the Ollama API to respond
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ollama_port }}/api/version"
    status_code: 200
  register: ollama_up
  retries: 40
  delay: 5
  until: ollama_up is succeeded

- name: Check which models are already pulled
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ollama_port }}/api/tags"
    method: GET
    status_code: 200
  register: ollama_tags

- name: Pull the demo models (several GB - first run takes a few minutes)
  # Two models by design: a small chat model for the root cause analysis, and a
  # code-specialised one for generating the remediation playbook. A general 2B
  # chat model cannot reliably emit valid YAML, which shows up mid-demo as
  # "the model did not return a usable Ansible Playbook".
  ansible.builtin.command:
    cmd: "podman exec ollama ollama pull {{ item }}"
  loop: "{{ [ollama_model, ollama_codegen_model] | select | unique | list }}"
  loop_control:
    label: "{{ item }}"
  when: >-
    item not in (
      ollama_tags.json.models | default([]) | map(attribute='name') | list
    )
  changed_when: true
  timeout: 1800

- name: Warm each model so no demo step pays a cold start
  # Both models, because the demo calls the chat model for the RCA and the code
  # model for generation. Warming only the first leaves a 30-90s stall in the
  # middle of the run, right when the audience is watching.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ollama_port }}/v1/chat/completions"
    method: POST
    body_format: json
    body:
      model: "{{ item }}"
      messages:
        - role: user
          content: "Reply with the single word: ready"
      max_tokens: 5
      temperature: 0
    status_code: 200
    timeout: 300
  loop: "{{ [ollama_model, ollama_codegen_model] | select | unique | list }}"
  loop_control:
    label: "{{ item }}"
  register: ollama_warm
  retries: 3
  delay: 10
  until: ollama_warm is succeeded

- name: Report the inference endpoint
  ansible.builtin.debug:
    msg: >-
      Ollama ready at http://{{ control_private_ip }}:{{ ollama_port }}/v1
      serving model '{{ ollama_model }}'.
